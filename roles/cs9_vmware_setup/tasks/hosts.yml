---
- name: Manage lab host entries in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK - centosstream9-vmware-setup"
    block: |
      {% for item in hosts_entries %}
      {{ item.ip }} {{ item.fqdn }} {{ item.aliases | default('') }}
      {% endfor %}
    backup: true
  when: manage_hosts | default(false) | bool
