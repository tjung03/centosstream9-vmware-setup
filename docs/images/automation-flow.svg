<title id="title">CentOS Stream 9 VM 설정 · 자동화 흐름</title><desc id="desc">start.sh가 실행 환경과 현재 호스트 상태를 조회하고 dialog TUI 선택값을 변수 파일에 저장한다. playbook은 preflight와 backup을 거쳐 선택한 기능별 task를 적용하며, 별도 restore 경로로 백업을 복구할 수 있다.</desc>
