<path d="M595 161 H650" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<path d="M755 193 V235 H248 V265" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="32" y="241" width="936" height="180" rx="12" fill="#fff" stroke="#b8c7e3"/>
<text x="52" y="273" font-size="17" font-weight="700" fill="#4865a0">02  Ansible 적용</text>
<rect x="145" y="265" width="205" height="68" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="163" y="292" font-size="16" font-weight="700" fill="#163b76">generated_vars/env.yml</text><text x="163" y="316" font-size="13" fill="#263a54">선택값 저장 · 0600</text>
<rect x="397" y="265" width="180" height="68" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="415" y="292" font-size="16" font-weight="700" fill="#163b76">playbook.yml</text><text x="415" y="316" font-size="13" fill="#263a54">localhost · Role 실행</text>
<rect x="624" y="265" width="205" height="68" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="642" y="292" font-size="16" font-weight="700" fill="#163b76">Role Preflight</text><text x="642" y="316" font-size="13" fill="#263a54">적용 전 조건 확인</text>
