<path d="M605 187 H665" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="32" y="250" width="936" height="190" rx="12" fill="#fff" stroke="#b8c7e3"/>
<text x="52" y="282" font-size="17" font-weight="700" fill="#4865a0">02  Ansible 적용</text>

<rect x="85" y="305" width="185" height="72" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="103" y="333" font-size="16" font-weight="700" fill="#163b76">generated_vars/env.yml</text>
<text x="103" y="357" font-size="13" fill="#263a54">선택값 저장 · 0600</text>

<rect x="310" y="305" width="150" height="72" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="328" y="333" font-size="16" font-weight="700" fill="#163b76">playbook.yml</text>
<text x="328" y="357" font-size="13" fill="#263a54">localhost</text>

