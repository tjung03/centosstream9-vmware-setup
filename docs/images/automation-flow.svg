<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">CentOS Stream 9 VM 설정 · 자동화 흐름</title><desc id="desc">Setup 모드에서는 start.sh가 OS와 권한을 검사하고 현재 환경을 감지한 뒤 dialog TUI 선택값을 generated_vars/env.yml에 저장한다. playbook의 Role은 preflight 후 변경 전 backup을 만들고 선택된 기능 Task를 적용한다. Restore 모드는 별도 restore.yml을 통해 선택한 backup을 복구한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="610" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">CentOS Stream 9 VM 설정 · 자동화 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Setup · 환경 감지 · TUI · Ansible Role · Backup / Restore</text>

<rect x="32" y="104" width="936" height="112" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="52" y="136" font-size="17" font-weight="700" fill="#4865a0">01  Setup 입력</text>
<rect x="150" y="129" width="190" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="168" y="156" font-size="16" font-weight="700" fill="#163b76">실행 환경 검사</text><text x="168" y="180" font-size="13" fill="#263a54">CentOS 9 · root · TTY</text>
<rect x="405" y="129" width="190" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="423" y="156" font-size="16" font-weight="700" fill="#163b76">현재 환경 감지</text><text x="423" y="180" font-size="13" fill="#263a54">Hostname · NIC · IP · DNS</text>
<rect x="660" y="129" width="190" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="678" y="156" font-size="16" font-weight="700" fill="#163b76">dialog TUI</text><text x="678" y="180" font-size="13" fill="#263a54">적용 항목 · 값 선택</text>
