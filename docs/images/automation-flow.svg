<text x="423" y="511" font-size="16" font-weight="700" fill="#086b62">restore.yml</text><text x="423" y="535" font-size="13" fill="#263a54">Role tasks_from: restore</text>
<rect x="645" y="484" width="210" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="663" y="511" font-size="16" font-weight="700" fill="#086b62">선택 Backup 복구</text><text x="663" y="535" font-size="13" fill="#263a54">파일 · 서비스 상태 복원</text>
<path d="M355 516 H395" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M595 516 H635" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>