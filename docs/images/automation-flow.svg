<text x="135" y="180" font-size="17" font-weight="700" fill="#163b76">실행 환경 검사</text>
<text x="135" y="204" font-size="13" fill="#263a54">CentOS 9 · root · TTY</text>

<rect x="395" y="153" width="210" height="68" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="415" y="180" font-size="17" font-weight="700" fill="#163b76">현재 환경 감지</text>
<text x="415" y="204" font-size="13" fill="#263a54">Hostname · NIC · IP · DNS</text>

<rect x="675" y="153" width="210" height="68" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="695" y="180" font-size="17" font-weight="700" fill="#163b76">dialog TUI</text>
<text x="695" y="204" font-size="13" fill="#263a54">적용 항목 · 값 선택</text>

