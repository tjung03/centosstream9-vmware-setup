<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">CentOS Stream 9 VM 설정 · Setup 흐름</title>
<desc id="desc">start.sh의 apply 모드는 root, TTY, OS를 검사하고 현재 Hostname과 Network 상태를 감지한다. dialog TUI에서 선택한 값을 generated_vars/env.yml에 저장하고 playbook.yml을 실행한다. Role은 preflight와 변경 전 backup 후 선택된 기능 Task를 순서대로 적용한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="500" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">CentOS Stream 9 VM 설정 · Setup 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Environment Detection · TUI · Variables · Ansible Role</text>

<rect x="32" y="108" width="936" height="120" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="52" y="140" font-size="17" font-weight="700" fill="#4865a0">01  Bash / TUI</text>

