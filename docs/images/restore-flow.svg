<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">CentOS Stream 9 VM 설정 · Restore 흐름</title>
<desc id="desc">start.sh --restore 모드는 기존 backup을 선택하고 Network 복구와 Package 제거 옵션을 결정한다. 선택한 값을 restore.yml에 extra vars로 전달하고 cs9_vmware_setup Role의 restore Task를 실행해 저장된 상태를 복구한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="360" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">CentOS Stream 9 VM 설정 · Restore 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Backup Selection · Restore Options · restore.yml · Role</text>

<rect x="32" y="112" width="936" height="180" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>

<rect x="55" y="158" width="190" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="75" y="187" font-size="17" font-weight="700" fill="#086b62">start.sh --restore</text>
<text x="75" y="214" font-size="14" fill="#263a54">Restore Mode</text>

<rect x="285" y="158" width="210" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="305" y="187" font-size="17" font-weight="700" fill="#086b62">Backup · 옵션 선택</text>
<text x="305" y="214" font-size="14" fill="#263a54">Network / Package 선택</text>

<rect x="535" y="158" width="180" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="555" y="187" font-size="17" font-weight="700" fill="#086b62">restore.yml</text>
<text x="555" y="214" font-size="14" fill="#263a54">Extra Vars 전달</text>

<rect x="745" y="158" width="210" height="86" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="765" y="187" font-size="17" font-weight="700" fill="#086b62">Role · restore Task</text>
